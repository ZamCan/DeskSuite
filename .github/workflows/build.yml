name: DeskSuite build matrix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name desksuite --org com.zamcan.desksuite --platforms=android,ios,windows,linux .
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: desksuite-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  windows:
    name: Windows desktop bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name desksuite --org com.zamcan.desksuite --platforms=android,ios,windows,linux .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath desksuite-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desksuite-windows-x64
          path: desksuite-windows-x64.zip
          if-no-files-found: error
  linux:
    name: Linux desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter create --project-name desksuite --org com.zamcan.desksuite --platforms=android,ios,windows,linux .
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf desksuite-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: desksuite-linux-x64
          path: desksuite-linux-x64.tar.gz
          if-no-files-found: error
  ios:
    name: iOS unsigned validation build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name desksuite --org com.zamcan.desksuite --platforms=android,ios,windows,linux .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app desksuite-ios-unsigned-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desksuite-ios-unsigned-validation
          path: desksuite-ios-unsigned-app.zip
          if-no-files-found: error
