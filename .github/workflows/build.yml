name: DeskSuite build matrix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_release:
        description: 'Explicitly opt in to unsigned CI packaging (the owner normally packages locally)'
        type: boolean
        default: false
concurrency:
  group: desksuite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate-brand-assets.py
      - run: python3 tools/test_ci_policy.py
      - run: python3 tools/test_camera_contract.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Generate hosted package licence inventory
        run: python3 tools/generate_pub_notices.py
      - name: Capture resolved package notices for audit
        uses: actions/upload-artifact@v4
        with:
          name: desksuite-resolved-pub-notices
          path: third_party/pub-packages.LICENSES.txt
          if-no-files-found: error
      - name: Capture resolved lockfile for release audit
        uses: actions/upload-artifact@v4
        with:
          name: desksuite-resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build Android release APK
        run: flutter build apk --release
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - name: Build Android release app bundle
        run: flutter build appbundle --release
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        with:
          name: desksuite-android-unsigned
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  windows:
    name: Windows desktop bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name desksuite --org com.zamcan.desksuite --platforms=windows .
      - run: git checkout -- test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
      - shell: pwsh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath desksuite-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
        with:
          name: desksuite-windows-x64
          path: desksuite-windows-x64.zip
          if-no-files-found: error
  linux:
    name: Linux desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - run: flutter create --project-name desksuite --org com.zamcan.desksuite --platforms=linux .
      - run: git checkout -- test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
      - run: tar -czf desksuite-linux-x64.tar.gz -C build/linux/x64/release/bundle .
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
      - name: Assemble AppImage directory
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
        run: |
          mkdir -p AppDir/usr
          cp -a build/linux/x64/release/bundle/. AppDir/usr/
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/desksuite" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/desksuite.desktop <<'EOF'
          [Desktop Entry]
          Name=DeskSuite
          Exec=AppRun
          Icon=desksuite
          Type=Application
          Categories=Office;Graphics;
          Comment=Offline-first creative and productivity workspace
          Terminal=false
          EOF
          cp assets/brand/desksuite-app-icon.svg AppDir/desksuite.svg
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir desksuite-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
        with:
          name: desksuite-linux-x64
          path: |
            desksuite-linux-x64.tar.gz
            desksuite-x86_64.AppImage
          if-no-files-found: error
  ios:
    name: iOS unsigned validation build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name desksuite --org com.zamcan.desksuite --platforms=ios .
      - run: git checkout -- test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app desksuite-ios-unsigned-app.zip
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_release }}
        with:
          name: desksuite-ios-unsigned-validation
          path: desksuite-ios-unsigned-app.zip
          if-no-files-found: error
