name: DeskSuite Android release verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desksuite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos

      - name: Run widget and unit tests
        run: flutter test

      - name: Build release-mode APK for verification
        run: flutter build apk --release

      - name: Inspect APK signing certificate
        if: success()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          echo "APK SHA256:"
          sha256sum "$APK"
          echo "Signing certificate (informational; NOT release certification):"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload unverified release-mode build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desksuite-release-mode-unverified
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
