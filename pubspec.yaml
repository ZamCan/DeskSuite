name: desksuite
description: Creative, office, document and print workspace.
publish_to: 'none'
version: 0.2.1+4

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: 13.1.0
  image_picker: 1.2.4
  path_provider: 2.1.6
  pdf: 3.13.1
  # Existing-PDF viewer/editor; pinned until Android memory and compatibility are benchmarked.
  dart_pdf_editor: 10.0.0
  # Used by PDF inspection and validated multi-document merge.
  pdf_document: 10.0.0
  image: ^4.5.4
  printing: ^5.14.2
  # Direct: OOXML (DOCX/XLSX/PPTX) parts are ZIP containers read and written by
  # lib/ocr and lib/office. It was previously only a transitive `pdf` dependency.
  archive: ^4.5.2
  # Direct: office packages (DOCX/XLSX/PPTX/ODF) are XML; read/written here.
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/samples/
    - assets/tessdata/
  fonts:
    # Embedded so generated PDFs keep smart quotes, dashes, accents and
    # non-Latin text instead of silently dropping glyphs. OFL-1.1.
    - family: DeskSuiteSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
